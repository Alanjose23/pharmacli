
name: PharmaCLI build and evaluation

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build-and-verify:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - name: checkout repository
              uses: actions/checkout@v4

            - name: set up python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: "${{ matrix.python-version }}"
                  cache: 'pip'

            - name: Install dependencies and package
              run: |
                  python -m pip install --upgrade pip
                  pip install -e .

            # ruff does not vary across the matrix -- target-version is pinned in
            # pyproject -- so one leg is enough. Not a declared dependency, for
            # the same reason mypy is not: it is a tool, not a requirement.
            - name: Lint
              if: matrix.python-version == '3.12'
              run: |
                  pip install ruff
                  ruff check src tests

            - name: Verify Executable Creation
              run: pharmacli --help

            
            - name: Verify Command Routing (Dry Run)
              run: |
                  pharmacli columns
                  pharmacli rules
                  python - <<'EOF'
                  from pharmacli.models.rows import COLUMNS
                  rows = [
                      "STRIBILD TABLET,61958120101,150.40902,01/01/2026,EA,C/I,N,4,B,,,04/29/2026",
                      "BENICAR HCT 40-25 MG TAB,00713086530,15.66969,05/20/2026,EA,C/I,N,1,B,0.23432,05/20/2026,06/10/2026",
                  ]
                  with open("fixture.csv", "w") as fh:
                      fh.write(",".join(COLUMNS) + "\n")
                      fh.write("\n".join(rows) + "\n")
                  EOF
                  pharmacli clean fixture.csv --rule dedup --dryrun
                  pharmacli clean fixture.csv --rule sort:by=date --dryrun

            
            - name: Verify Benchmark (CPU workload only)
              run: pharmacli bench --workload cpu --workers 2

            # the analysis tests the numpy imports to verify that it works
            - name: Install analysis extra and run tests
              run: |
                  # [serve] too, so the API tests actually run. NOT [track]:
                  # mlflow across a 3-version matrix would dominate CI time, and
                  # test_track.py is written to need no mlflow import.
                  pip install -e ".[analysis,serve,rag]"
                  pytest -q

            - name: Verify Vectorization Benchmark
              run: pharmacli bench --workload numpy

            # One leg only: the image does not vary across the python matrix, and
            # building it three times buys nothing. Without this step a broken
            # Dockerfile ships silently and is found in front of a reviewer.
            - name: Build the image and smoke test it
              if: matrix.python-version == '3.12'
              run: |
                  docker build -t pharmacli-api .
                  docker run -d --name api -e PHARMACLI_JWT_SECRET=ci -p 8000:8000 pharmacli-api
                  for _ in $(seq 30); do
                      curl -sf localhost:8000/health >/dev/null && break
                      sleep 2
                  done
                  # asserts the committed demo fixture actually loaded: without it
                  # this proves only that the process started
                  python - <<'EOF'
                  import json, urllib.request
                  d = json.load(urllib.request.urlopen("http://localhost:8000/health"))
                  assert d["model"] == "pharmacli-mover-demo/0", d
                  assert d["ndcs"] > 0, d
                  print(f"smoke ok: {d['model']} over {d['ndcs']} NDCs")
                  EOF
                  docker logs api
                  docker rm -f api
