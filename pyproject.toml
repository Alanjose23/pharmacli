[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "pharmacli"
version = "2.0"
description = "CLI tool for parsing medicine"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.27",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
pharmacli = "pharmacli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pharmacli*"]