[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "pharmacli"
version = "2.0"
description = "CLI tool for parsing medicine"
readme = "README.md"
requires-python = ">=3.10"

# httpx only. .env parsing is eight lines of stdlib in config.py
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
pharmacli = "pharmacli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pharmacli*"]

# chat.html is the browser page `pharmacli chat` serves; it ships with the module
[tool.setuptools.package-data]
pharmacli = ["*.html"]

# analysis: pip install -e ".[analysis]"
[project.optional-dependencies]
analysis = [
    "pandas>=2.2",
    "numpy>=1.26",
    # CI runs `pip install -e ".[analysis]"` then `pytest -q`.
    "pytest>=8",
    # week 5: leak-free pipeline + explainability. HistGradientBoosting comes
    # with sklearn, so no xgboost/lightgbm dependency is needed
    "scikit-learn>=1.4",
    # shap is NOT here: only model.explain uses it, and only notebooks/week5.ipynb
    # calls that. `pip install shap` when you run the notebook.
]

# the two notebooks, and nothing else: matplotlib draws their charts, jupyterlab
# runs them, shap explains the model in week5.ipynb. No module in src/ imports any
# of the three, so `forecast` and the test suite do not drag them in.
notebook = [
    "matplotlib>=3.8",
    "jupyterlab>=4",
    "shap>=0.44",
]

# week 6, split deliberately. `serve` is light enough for CI to install so the
# API tests actually run; `track` drags in mlflow (sqlalchemy, alembic, flask)
# and is dev-only. serve.py never imports mlflow, which is what makes the split
# possible -- see the joblib+sidecar export in track.py.
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# dvc is not listed: no module imports it. It is a command-line tool, run by
# hand to version pharmacli.db -- `pipx install dvc` (or pip) when you need it.
track = [
    "mlflow>=2.9",
]

# week 7. Install torch from the CPU index or pip drags in multi-GB CUDA wheels
# this machine has no GPU for:
#   pip install --index-url https://download.pytorch.org/whl/cpu torch
# No torchvision and no medmnist package: the dataset is a plain .npz behind a
# URL and the augmentations are four lines of numpy. tensorboard is required by
# torch.utils.tensorboard.SummaryWriter.
dl = [
    "torch>=2.2",
    "tensorboard>=2.16",
]

# week 8. sentence-transformers pulls transformers + tokenizers with it, so one
# entry covers embeddings AND fine-tuning. Deliberately NOT here: `datasets`
# (the corpus is a SQL query) and any vector store -- 6,359 x 384 floats is a
# 9.8MB matrix and the whole index is one np.dot.
nlp = [
    "sentence-transformers>=3.0",
]

# week 9. PyMuPDF is the only new package: Chroma and Ollama are both spoken to
# over HTTP with the httpx already in the core install. chromadb-client was
# measured and left out -- it pulls grpcio and OpenTelemetry for five REST calls.
rag = [
    "pymupdf>=1.24",
]

# these ship without type stubs
[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "shap.*", "mlflow.*", "dvc.*", "joblib.*", "torch.*", "pymupdf.*"]
ignore_missing_imports = true

# tests were renamed t
[tool.pytest.ini_options]
python_functions = "t*"
