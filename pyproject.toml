[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "pharmacli"
version = "2.0"
description = "CLI tool for parsing medicine"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
pharmacli = "pharmacli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pharmacli*"]

# desk.html is the buying-desk template `pharmacli desk` fills in; it has to
# ship with the package, not just sit in the source tree
[tool.setuptools.package-data]
pharmacli = ["desk.html"]

# analysis: pip install -e ".[analysis]"
[project.optional-dependencies]
analysis = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "jupyterlab>=4",
    # CI runs `pip install -e ".[analysis]"` then `pytest -q`.
    "pytest>=8",
    # week 5: leak-free pipeline + explainability. HistGradientBoosting comes
    # with sklearn, so no xgboost/lightgbm dependency is needed
    "scikit-learn>=1.4",
    "shap>=0.44",
]

# pandas and scipy ship
[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*", "sklearn.*", "shap.*"]
ignore_missing_imports = true

# tests were renamed t
[tool.pytest.ini_options]
python_functions = "t*"
